name: engine eval

# The weld engine decides what gets welded and where a spool is cut, so a
# silent regression in it is a fabrication error waiting to happen. This gate
# is the reason EPIC-7 is sequenced before any other work on the engine.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The eval gate deliberately runs BEFORE any install: the harness has no
      # dependencies and reads the engine straight from source, so it cannot
      # be broken by an unrelated dependency problem, and it stays fast.
      - name: Run engine eval against the recorded baseline
        run: npm run eval:check -- --json eval/results/ci.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/ci.json
          if-no-files-found: warn

  data-layer:
    # Pin the runner: ubuntu-latest currently resolves to Ubuntu 26.04
    # (resolute), whose apt mirror DNS has repeatedly failed in CI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The document intake reads scanned PDFs with Tesseract; its tests run it.
      - name: OCR engine
        shell: bash
        run: |
          set -euo pipefail
          if command -v tesseract >/dev/null && command -v pdftoppm >/dev/null; then
            echo "OCR dependencies already installed."
          else
            # Transient DNS/mirror errors should not abort the entire test suite
            # on the first attempt; still fail if installation never succeeds.
            for attempt in 1 2 3; do
              if sudo apt-get update -o Acquire::Retries=3 -qq &&
                 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=3 tesseract-ocr poppler-utils; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not install OCR dependencies after three attempts"
                exit 1
              fi
              sleep $((attempt * 10))
            done
          fi
          tesseract --version
          pdftoppm -v

      # Runs against real PostgreSQL via PGlite, in-process: no service
      # container, no credentials, and the same migrations production applies.
      - name: Data layer tests
        run: npm run db:test

  # Planning's DB regression tests do not use OCR. Keep this gate independent
  # of the OS package mirrors so a transient apt outage cannot hide a bug.
  planning-db:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Planning database regression tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./tools/register.mjs db/test/planning.mjs

  # The pages compile: a type or import error in a page is found here, not on the server.
  # (db:test imports the libraries and routes, but not the React pages.)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  # Project scope on a REAL node-postgres pool. PGlite is one connection and cannot show what a pool does
  # (db/test/pg-scope.mjs), so this is the only place that proves it.
  pg-scope:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iw
          POSTGRES_PASSWORD: iw
          POSTGRES_DB: iw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Project scope and material lifecycle on node-postgres
        run: npm run db:test:pg
        env:
          PG_TEST_URL: postgres://iw:iw@localhost:5432/iw
